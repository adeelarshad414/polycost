{{- if .Values.migrations.enabled }}
# Audit H-06: the chart had no migration step (a comment claimed the app ran
# them; it never did). This Job runs the migrator before every install and
# upgrade, so new pods never start against an older schema. A failed Job fails
# the Helm release and the running pods are left untouched.
#
# The migrator holds a Postgres advisory lock, so a concurrent run (a retried
# Job, a manual `npm run db:migrate`) waits instead of racing.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "polycost.fullname" . }}-migrate
  labels:
    {{- include "polycost.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # A hook runs before the release's own resources (the ConfigMap included)
    # exist on first install, so everything it needs is set inline below.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "polycost.name" . }}-migrations
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "polycost.image" (dict "image" .Values.migrations.image "root" .) | quote }}
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.config.dbHost | quote }}
            - name: PGPORT
              value: {{ .Values.config.dbPort | quote }}
            - name: PGDATABASE
              value: {{ .Values.config.dbName | quote }}
            - name: PGSSLMODE
              value: {{ .Values.config.db.sslMode | quote }}
            - name: PGCONNECT_TIMEOUT
              value: "10"
            # Schema changes need the owner, not the least-privilege app role.
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ required "migrations.ownerSecret.name is required" .Values.migrations.ownerSecret.name }}
                  key: {{ .Values.migrations.ownerSecret.usernameKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migrations.ownerSecret.name }}
                  key: {{ .Values.migrations.ownerSecret.passwordKey }}
            {{- with .Values.migrations.rolePasswordsSecret }}
            {{- if .name }}
            # Only used when 002 has to create the app/etl roles. They must
            # match the credentials stored in Vault under polycost/db.
            - name: APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .appKey }}
            - name: ETL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .etlKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.config.db.sslCaSecret.name }}
            - name: PGSSLROOTCERT
              value: /run/polycost-db-ca/{{ .Values.config.db.sslCaSecret.key }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          volumeMounts:
            # The migrator writes its plan with mktemp.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.config.db.sslCaSecret.name }}
            - name: db-ca
              mountPath: /run/polycost-db-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.config.db.sslCaSecret.name }}
        - name: db-ca
          secret:
            secretName: {{ .Values.config.db.sslCaSecret.name }}
        {{- end }}
{{- end }}
