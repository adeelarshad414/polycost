{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy works on ports, not paths, and /metrics shares the `http` port
# with the API. The previous version allowed that port from anywhere, which made
# the monitoring-only rule meaningless. Now only three sources reach the pod:
#   1. the ingress controller's namespace, which must deny /metrics (README);
#   2. the monitoring namespace, for scrapes;
#   3. any peers listed in networkPolicy.extraIngressFrom (e.g. the web tier).
# Everything else in the cluster is denied, /metrics included.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "polycost.fullname" . }}
  labels:
    {{- include "polycost.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "polycost.selectorLabels" . | nindent 6 }}
  policyTypes: ['Ingress']
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- required "networkPolicy.ingressNamespaceSelector is required" .Values.networkPolicy.ingressNamespaceSelector | toYaml | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              {{- required "networkPolicy.monitoringNamespaceSelector is required" .Values.networkPolicy.monitoringNamespaceSelector | toYaml | nindent 14 }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
{{- end }}
