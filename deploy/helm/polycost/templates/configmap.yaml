apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polycost.fullname" . }}
  labels:
    {{- include "polycost.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.containerPort | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  # Audit M-06: four pools per pod, so connections = 4 x poolMax x replicas.
  DB_POOL_MAX: {{ .Values.config.db.poolMax | quote }}
  DB_STATEMENT_TIMEOUT_MS: {{ .Values.config.db.statementTimeoutMs | quote }}
  DB_ETL_STATEMENT_TIMEOUT_MS: {{ .Values.config.db.etlStatementTimeoutMs | quote }}
  DB_SSL_MODE: {{ .Values.config.db.sslMode | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_TLS: {{ .Values.config.redis.tls | quote }}
  REDIS_USERNAME: {{ .Values.config.redis.username | quote }}
  # false: this release serves HTTP only and a separate worker deployment owns
  # the BullMQ jobs. Schedulers are registered either way.
  JOB_WORKERS_ENABLED: {{ .Values.config.jobWorkersEnabled | quote }}
  VAULT_ADDR: {{ .Values.config.vaultAddr | quote }}
  VAULT_TOKEN_FILE: {{ printf "%s/%s" .Values.vaultToken.mountPath .Values.vaultToken.key | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  # Proxies in front of the API (ingress + web nginx = 1 by default). Rate limits
  # key on the client address Fastify resolves through exactly this many hops.
  TRUST_PROXY_HOPS: {{ .Values.config.trustProxyHops | quote }}
  # Explicit, never defaulted: production must run on real provider pricing.
  USE_MOCK_PROVIDERS: {{ .Values.config.useMockProviders | quote }}
  # ADR-0001: always rendered, never defaulted - every install decides whether
  # people may compare without an account.
  ANONYMOUS_MODE: {{ required "config.anonymousMode must be set to enabled or disabled" .Values.config.anonymousMode | quote }}
  ALLOW_MOCK_PROVIDERS_OUTSIDE_DEVELOPMENT: {{ .Values.config.allowMockProvidersOutsideDevelopment | quote }}
  # Both are empty-string tolerant in the config schema: compose and Helm both
  # render unset values as "", and a bare .url() would reject that at boot.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterEndpoint | quote }}
  ERROR_TRACKING_DSN: {{ .Values.config.errorTrackingDsn | quote }}
