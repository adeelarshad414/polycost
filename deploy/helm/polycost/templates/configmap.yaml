apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polycost.fullname" . }}
  labels:
    {{- include "polycost.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.containerPort | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  VAULT_ADDR: {{ .Values.config.vaultAddr | quote }}
  VAULT_TOKEN_FILE: {{ printf "%s/%s" .Values.vaultToken.mountPath .Values.vaultToken.key | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  # Both are empty-string tolerant in the config schema: compose and Helm both
  # render unset values as "", and a bare .url() would reject that at boot.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterEndpoint | quote }}
  ERROR_TRACKING_DSN: {{ .Values.config.errorTrackingDsn | quote }}
