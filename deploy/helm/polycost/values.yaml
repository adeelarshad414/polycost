# PolyCost API deployment values.
#
# Postgres, Redis and Vault are NOT bundled. They are stateful and this chart
# should not be the thing that owns your data; point it at managed instances or
# charts that specialise in them. See the requirements in the README before
# doing so - Redis in particular has a hard requirement this project learned the
# hard way.

replicaCount: 2

image:
  repository: polycost-api
  tag: latest
  pullPolicy: IfNotPresent

# Pre-install / pre-upgrade migration Job (templates/migrations-job.yaml).
migrations:
  enabled: true
  image:
    # Built from database/Dockerfile.
    repository: polycost-migrations
    tag: latest
    pullPolicy: IfNotPresent
  # The migrator is idempotent and lock-protected, so one retry is safe.
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  # Database owner credentials: schema changes need more than the app role.
  ownerSecret:
    name: polycost-db-owner
    usernameKey: username
    passwordKey: password
  # Only needed on a database where polycost_app / polycost_etl do not exist
  # yet; the passwords must match Vault's polycost/db secret.
  rolePasswordsSecret:
    name: ''
    appKey: app_password
    etlKey: etl_password
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

service:
  type: ClusterIP
  port: 3000

# The container listens here; the API reads PORT from validated config.
containerPort: 3001

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    # No CPU limit on purpose: CPU throttling under a limit shows up as latency
    # and would breach the p95 objectives the load test now enforces. Memory is
    # limited because a leak should kill the pod rather than the node.
    memory: 1Gi

probes:
  # The app runs a startup pricing refresh before it serves (migrations run
  # earlier, in the pre-install/pre-upgrade Job), and
  # was measured at roughly 40-50s to healthy. The startup probe is what buys
  # that time; without it the liveness probe kills the pod mid-boot and the
  # deployment never converges.
  startup:
    periodSeconds: 5
    failureThreshold: 30 # 150s budget
  liveness:
    # Liveness, deliberately not readiness. Restarting cannot fix a database or
    # cache that is briefly unavailable, and a liveness probe on /health/ready
    # turns a dependency blip into a restart loop.
    path: /health/live
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    # Ready = the database answers SELECT 1 (bounded at 1s in the app). Redis
    # being down degrades the pod but keeps it in service (audit M-09).
    path: /health/ready
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

# Nest shutdown hooks close the HTTP server, drain BullMQ workers and flush
# batched OpenTelemetry spans. Too short a grace period truncates all three.
terminationGracePeriodSeconds: 45

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# /metrics is unauthenticated by design - scrapers carry no session token. It is
# aggregate data with no tenant content, but it does describe traffic volume,
# auth failure rates and ETL throughput, so it must not be publicly reachable.
# NetworkPolicy is port-level, so /metrics cannot be singled out by path: the
# pod accepts traffic only from the ingress controller, the monitoring namespace
# and extraIngressFrom. The ingress must also deny /metrics (see README).
networkPolicy:
  enabled: true
  # Namespace of the ingress controller that fronts the API.
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  # Namespaces allowed to scrape /metrics.
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring
  # Additional NetworkPolicyPeer entries, e.g. the web tier when it proxies /api:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: polycost-web
  extraIngressFrom: []

config:
  nodeEnv: production
  logLevel: info
  dbHost: postgres
  dbPort: 5432
  dbName: polycost
  db:
    # Per pool; there are four pools per pod.
    poolMax: 5
    statementTimeoutMs: 30000
    # Bulk pricing upserts and the catalog prune.
    etlStatementTimeoutMs: 300000
    # disable | require | verify-full. Use verify-full for managed Postgres.
    sslMode: disable
    # Optional CA bundle for verify-full, read from a Secret.
    sslCaSecret:
      name: ''
      key: ca.crt
  redisHost: redis
  redisPort: 6379
  redis:
    tls: false
    username: ''
    # Optional AUTH password, read from a Secret rather than the ConfigMap.
    passwordSecret:
      name: ''
      key: password
  # Run BullMQ workers in the API pods. Set false when a dedicated worker
  # deployment processes jobs.
  jobWorkersEnabled: true
  vaultAddr: http://vault:8200
  corsAllowedOrigins: ''
  # Proxy hops between clients and the API. Raise it if a CDN or extra load
  # balancer sits in front of the ingress; never set it higher than reality.
  trustProxyHops: 1
  # Real provider pricing. The API refuses to boot in production with mock
  # providers unless allowMockProvidersOutsideDevelopment is also true (demo only).
  useMockProviders: false
  allowMockProvidersOutsideDevelopment: false
  # Empty disables tracing; the OTel bootstrap is a no-op without an endpoint.
  otelExporterEndpoint: ''
  # Empty disables error reporting.
  errorTrackingDsn: ''

# The Vault token is read from a file, not an env var, so it can be a projected
# service-account token or a CSI-mounted secret rather than sitting in the pod
# spec.
vaultToken:
  secretName: polycost-vault-token
  key: token
  mountPath: /run/polycost-secrets

serviceMonitor:
  # Requires the Prometheus Operator CRDs; off by default so `helm install`
  # works on a plain cluster.
  enabled: false
  interval: 15s

nodeSelector: {}
tolerations: []
affinity: {}
