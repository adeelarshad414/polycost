server {
  # 8080, not 80: binding below 1024 needs root, and that is the only reason the
  # nginx master stayed privileged. The published host port is unchanged -
  # compose still maps ${WEB_PORT:-3000} - so nothing outside the container sees
  # this. See K-3b in docs/KNOWN-ISSUES.md.
  listen 8080;
  server_name _;
  # Do not advertise the nginx version in headers and error pages.
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Appending (rather than replacing) X-Forwarded-For is safe: the API trusts
    # exactly TRUST_PROXY_HOPS proxies and reads the client from the right, so a
    # value the client wrote on the left is never used (audit H-02).
    proxy_pass http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Security headers apply to the app shell and its assets. The /api and
  # /health locations pass the API's own headers (helmet) through instead, so
  # responses never carry two different policies.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
