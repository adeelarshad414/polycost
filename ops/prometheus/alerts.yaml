# Alert rules for PolyCost.
#
# Every rule carries a `runbook` annotation pointing at the section of
# docs/RUNBOOK.md that says what to do about it. An alert without instructions
# is a page that wakes someone up with nothing to act on, so
# scripts/alert-rules-check.mjs fails the build if a metric or a runbook anchor
# referenced here does not exist.
#
# Thresholds are taken from the Service Objectives table in the runbook and from
# the actual job schedules, not chosen by feel. Where a number is invented, the
# comment says so.
groups:
  - name: polycost-availability
    rules:
      - alert: ApiDown
        expr: up{job="polycost-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'API is not answering scrapes'
          description: 'Prometheus cannot reach the API. If this is the only alert firing, the process is down rather than degraded.'
          runbook: 'docs/RUNBOOK.md#incident-app-does-not-start'

      - alert: PostgresUnavailable
        expr: dependency_up{dependency="db"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Postgres failed its health probe'
          description: 'The readiness probe could not connect to Postgres for 2 minutes. Comparisons and pricing reads will be failing.'
          runbook: 'docs/RUNBOOK.md#incident-database-unavailable'

      - alert: RedisUnavailable
        expr: dependency_up{dependency="cache"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Redis failed its health probe'
          description: 'Background jobs stop draining and rate limiting silently falls back to per-process counters, so limits no longer hold across instances.'
          runbook: 'docs/RUNBOOK.md#incident-redis-unavailable'

      - alert: VaultReadFailures
        expr: rate(vault_reads_total{outcome="failure"}[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Secret reads from Vault are failing'
          description: 'Provider credentials and database passwords come from Vault. Sustained failures mean pricing refreshes and new database pools cannot start.'
          runbook: 'docs/RUNBOOK.md#incident-vault-read-failures'

  - name: polycost-api-slos
    rules:
      # 5xx only. http_request_errors_total also counts 4xx, and a burst of 401s
      # or 404s is a client problem, not an outage - alerting on it would train
      # people to ignore this.
      #
      # Probe and scrape endpoints are excluded from both SLO alerts. They are
      # not user journeys: a readiness probe returning 503 during a dependency
      # outage is the probe working correctly, and counting it here would double
      # -report the dependency alert that is already firing.
      - alert: ApiErrorRateHigh
        expr: |
          sum(rate(http_request_errors_total{status=~"5..", route!~"/metrics|/health.*|/api/v1/health.*"}[5m]))
            / clamp_min(sum(rate(http_requests_total{route!~"/metrics|/health.*|/api/v1/health.*"}[5m])), 0.001)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Over 5% of requests are returning 5xx'
          description: 'Sustained server errors. Check the trace for a failing downstream before restarting anything.'
          runbook: 'docs/RUNBOOK.md#incident-high-api-error-rate'

      # 800 ms is the documented p95 target for the slowest API journey
      # (pricing matrix/breakdown). Alerting at the 500 ms cached-comparison
      # target would fire on legitimate matrix traffic.
      # Excludes /metrics and the health probes for the same reason. Verified
      # against a live stack: with Redis down, /metrics p95 hit 2.4s because of
      # its own bounded queue read, which pushed this alert into pending while
      # every user-facing route stayed well inside budget.
      - alert: ApiLatencyBudgetBreached
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{route!~"/metrics|/health.*|/api/v1/health.*"}[10m])
            )
          ) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'API p95 is over the 800 ms objective'
          description: 'p95 has exceeded the runbook Service Objective for 10 minutes. Traces will show whether the time is in Postgres, a provider call, or the handler.'
          runbook: 'docs/RUNBOOK.md#incident-api-latency-budget-breached'

  - name: polycost-pricing-data
    rules:
      # The ETL runs daily at 02:00 (PRICING_ETL_SCHEDULE_CRON default
      # '0 2 * * *'), so 26h is one missed run plus buffer and 50h is two.
      - alert: PricingDataStale
        expr: |
          time() - max by (provider) (pricing_etl_last_success_timestamp_seconds) > 93600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'No successful pricing refresh for {{ $labels.provider }} in over 26 hours'
          description: 'One scheduled daily refresh has been missed. Comparisons are being served from ageing catalog data.'
          runbook: 'docs/RUNBOOK.md#incident-pricing-data-is-stale-or-missing'

      - alert: PricingDataCriticallyStale
        expr: |
          time() - max by (provider) (pricing_etl_last_success_timestamp_seconds) > 180000
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 'No successful pricing refresh for {{ $labels.provider }} in over 50 hours'
          description: 'Two scheduled refreshes have been missed. Quoted costs should not be treated as current.'
          runbook: 'docs/RUNBOOK.md#incident-pricing-data-is-stale-or-missing'

      # Fires even when a later run succeeds: a provider that fails and recovers
      # is still dropping a day of pricing updates, and the freshness gauge
      # alone would not show it.
      - alert: PricingEtlFailing
        expr: increase(pricing_etl_runs_total{status="failed"}[6h]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Pricing refresh failed for {{ $labels.provider }}'
          description: 'At least one provider refresh failed in the last 6 hours.'
          runbook: 'docs/RUNBOOK.md#incident-refresh-live-fails'

  - name: polycost-jobs
    rules:
      # 100 is a judgement call, not a measured limit - revisit once there is a
      # baseline for normal depth.
      - alert: JobQueueBacklogGrowing
        expr: job_queue_depth{state="waiting"} > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has a growing backlog'
          description: 'Jobs are arriving faster than the worker drains them. Check whether the worker is running before scaling.'
          runbook: 'docs/RUNBOOK.md#incident-job-queue-backlog'

      - alert: JobQueueFailuresAccumulating
        expr: job_queue_depth{state="failed"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Queue {{ $labels.queue }} has failed jobs sitting in it'
          description: 'Failed jobs do not retry on their own once exhausted. They stay until someone looks.'
          runbook: 'docs/RUNBOOK.md#incident-job-queue-backlog'

      # The depth gauge is removed rather than left stale when the queue cannot
      # be read, so absence is the signal that Redis is unreachable - not zero.
      - alert: JobQueueDepthUnknown
        expr: absent(job_queue_depth)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Queue depth cannot be read'
          description: 'The scrape succeeded but no queue reported its depth, which means the queue read timed out. Usually Redis.'
          runbook: 'docs/RUNBOOK.md#incident-redis-unavailable'

  - name: polycost-user-journeys
    rules:
      - alert: ReportExportsFailing
        expr: |
          sum(rate(report_exports_total{outcome="failure"}[15m]))
            / clamp_min(sum(rate(report_exports_total[15m])), 0.001)
            > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Over 10% of report exports are failing'
          description: 'Users are seeing broken downloads.'
          runbook: 'docs/RUNBOOK.md#incident-exports-fail'

      # 30 s is the documented Service Objective for an MVP-sized export.
      - alert: ReportExportBudgetBreached
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, format) (rate(report_export_duration_seconds_bucket[15m]))
          ) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.format }} exports are over the 30 s objective'
          description: 'p95 export duration has exceeded the runbook Service Objective.'
          runbook: 'docs/RUNBOOK.md#incident-exports-fail'

      # Lockouts are the intended defence working, so this is about volume:
      # a spike means either a credential-stuffing attempt or a broken client
      # locking real users out.
      - alert: AuthLockoutSpike
        expr: increase(auth_lockouts_total[15m]) > 5
        labels:
          severity: warning
        annotations:
          summary: 'Accounts are being locked out at an unusual rate'
          description: 'More than 5 lockouts in 15 minutes. Check whether auth_attempts_total is dominated by invalid_credentials (an attack in progress) or locked (already throttled).'
          runbook: 'docs/RUNBOOK.md#incident-auth-or-rbac-fails'
