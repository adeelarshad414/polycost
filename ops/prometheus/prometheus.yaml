# Local Prometheus for verifying alert rules against a running stack.
# A real deployment supplies its own scrape config; the rules file is the part
# meant to be reused.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: polycost-api
    metrics_path: /metrics
    static_configs:
      # Container port, not the host-published one.
      - targets: ['api:3001']
