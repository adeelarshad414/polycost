name: Release

# Audit H-13: there was no image publishing, signing, SBOM or provenance, and
# Helm deployed `:latest`, so a release could not be reproduced or rolled back.
#
#   pull_request   build every image and scan it; push nothing
#   push to main   publish `main` and `sha-<short>` images, signed and attested
#   tag vX.Y.Z     publish `X.Y.Z` and `X.Y` images, then package the Helm chart
#                  pinned to those digests and attach it to a GitHub Release
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'database/**'
      - 'docker/**'
      - 'package-lock.json'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/polycost

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless cosign signing and provenance (Sigstore OIDC)
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build-args: ''
          - name: web
            dockerfile: apps/web/Dockerfile
            # Same-origin API through the web nginx proxy; keeps the CSP
            # connect-src at 'self'.
            build-args: VITE_API_BASE_URL=/api/v1
          - name: migrations
            dockerfile: database/Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          # No `latest`: deployments name a version or a digest.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=ref,event=pr

      # Build once into the local daemon and scan it before anything is
      # published. The push step below reuses the layer cache.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          load: true
          push: false
          tags: polycost-${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Vulnerability scan (image)
        # Fixable HIGH/CRITICAL only: an unfixed base-image CVE has no action
        # to take until upstream ships a patch, and Dependabot tracks the bases.
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet
          polycost-${{ matrix.name }}:scan

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit attestations stored with the image: an SPDX SBOM and
          # SLSA provenance describing exactly how it was built.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign (keyless, Sigstore)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: GitHub build provenance attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Matrix legs cannot reliably share job outputs, so each leg hands its
      # digest to the chart job as a small artifact.
      - name: Record digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p digests
          printf '%s' "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.name }}"
          echo "### polycost-${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE_PREFIX }}-${{ matrix.name }}@${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7

  chart:
    # Tagged releases only: the chart is packaged with every image pinned by
    # digest, so `helm install` deploys exactly what was scanned and signed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the chart to GHCR (OCI)
      id-token: write # sign the chart
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Pin image digests into the chart
        id: digests
        run: |
          for name in api web migrations; do
            echo "$name=$(cat "digests/$name")" >> "$GITHUB_OUTPUT"
          done
          python3 scripts/pin-chart-digests.py deploy/helm/polycost/values.yaml \
            "$(cat digests/api)" "$(cat digests/migrations)"

      - name: Package and push the chart
        id: chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/polycost --version "$version" --app-version "$version" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/polycost-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts" 2>&1 | tee push.log
          digest="$(grep -o 'sha256:[0-9a-f]*' push.log | head -1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/polycost@${{ steps.chart.outputs.digest }}"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_DIGEST: ${{ steps.digests.outputs.api }}
          WEB_DIGEST: ${{ steps.digests.outputs.web }}
          MIGRATIONS_DIGEST: ${{ steps.digests.outputs.migrations }}
        run: |
          {
            echo "## Images (verify before deploying: see DEPLOY.md)"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$IMAGE_PREFIX-api\` | \`$API_DIGEST\` |"
            echo "| \`$IMAGE_PREFIX-web\` | \`$WEB_DIGEST\` |"
            echo "| \`$IMAGE_PREFIX-migrations\` | \`$MIGRATIONS_DIGEST\` |"
            echo
            echo "Helm: \`helm install polycost oci://ghcr.io/${{ github.repository_owner }}/charts/polycost --version ${{ steps.chart.outputs.version }}\`"
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/polycost-${{ steps.chart.outputs.version }}.tgz" \
            --title "PolyCost $GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes --verify-tag
