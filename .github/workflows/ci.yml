name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome
      - name: Format check
        run: npm run format:check
      - name: Lint and typecheck
        run: npm run ci:lint
      - name: Theme token hex guard
        run: npm run theme:hex:check
      # `npm run qa` invokes `npm run impeccable`. That check needs Node 24+, so
      # on Node 20 it used to exit 0 with a warning - the gate was green in CI
      # and red on any current developer machine. The runner is now Node 24 and
      # IMPECCABLE_ENFORCE makes the findings fail, so CI evaluates what a
      # developer evaluates.
      - name: Spec and workflow QA
        env:
          IMPECCABLE_ENFORCE: '1'
        run: npm run qa
      - name: Graph validation
        run: npm run graphify:validate
      - name: Pricing service coverage check
        run: npm run pricing:coverage:check
      - name: Full progress verification check
        run: npm run progress:verify
      - name: DevOps configuration check
        run: npm run devops:check
      - name: Cloud readiness check
        run: npm run cloud:check
      - name: Release readiness check
        run: npm run release:check
      - name: Provider credential readiness check
        run: npm run provider:credentials:check
      - name: Database migration validation
        run: npm run db:validate
      - name: Unit tests with coverage
        run: npm run ci:unit
      - name: Production-readiness focused regressions
        run: npm run test:production-readiness
      - name: Integration tests
        run: npm run ci:integration
      - name: Build
        run: npm run ci:build
      - name: E2E tests
        run: npm run ci:e2e
      - name: Dependency security scan
        run: npm run security:audit
