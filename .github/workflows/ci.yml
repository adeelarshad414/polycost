name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome
      - name: Format check
        run: npm run format:check
      - name: Lint and typecheck
        run: npm run ci:lint
      - name: Theme token hex guard
        run: npm run theme:hex:check
      # `npm run qa` invokes `npm run impeccable`. That check needs Node 24+, so
      # on Node 20 it used to exit 0 with a warning - the gate was green in CI
      # and red on any current developer machine. The runner is now Node 24 and
      # IMPECCABLE_ENFORCE makes the findings fail, so CI evaluates what a
      # developer evaluates.
      - name: Spec and workflow QA
        env:
          IMPECCABLE_ENFORCE: '1'
        run: npm run qa
      - name: Graph validation
        run: npm run graphify:validate
      - name: Pricing service coverage check
        run: npm run pricing:coverage:check
      - name: Full progress verification check
        run: npm run progress:verify
      - name: DevOps configuration check
        run: npm run devops:check
      - name: Cloud readiness check
        run: npm run cloud:check
      - name: Release readiness check
        run: npm run release:check
      - name: Provider credential readiness check
        run: npm run provider:credentials:check
      - name: Database migration validation
        run: npm run db:validate
      - name: Unit tests with coverage
        run: npm run ci:unit
      - name: Production-readiness focused regressions
        run: npm run test:production-readiness
      - name: Integration tests
        run: npm run ci:integration
      - name: Build
        run: npm run ci:build
      - name: Bundle budget
        run: npm run bundle:budget
      - name: E2E tests
        run: npm run ci:e2e
      - name: Dependency security scan
        run: npm run security:audit

  # UI-7: screenshot regression and Lighthouse budgets. Runs inside the same
  # Playwright image the baselines were generated in, so fonts and rasterisation
  # match pixel for pixel. To refresh baselines after an intended visual change:
  #   docker run --rm -v "$PWD":/work -w /work mcr.microsoft.com/playwright:v1.63.0-noble \
  #     bash -lc 'npm ci && npm run build --workspace @polycost/web && cd apps/web && npm run test:visual:update'
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Playwright's recommended setting: share the host IPC namespace so
      # Chromium is not limited to Docker's 64 MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: Build web
        run: npm run build --workspace @polycost/web
      - name: Visual regression
        run: npm run test:visual --workspace @polycost/web
      - name: Lighthouse budgets
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run lighthouse:ci
      - name: Upload visual diffs and Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-and-lighthouse
          path: |
            test-results/web-playwright
            .lighthouseci/reports
