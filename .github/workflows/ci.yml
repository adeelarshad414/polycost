name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege (audit M-17): jobs read the repo and nothing else. A job that
# needs more asks for it explicitly.
permissions:
  contents: read

# A new push to a PR supersedes the run in progress; main always runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions and images are pinned to an immutable SHA or digest, with
# the human-readable version in a comment. Dependabot keeps both up to date.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome
      - name: Format check
        run: npm run format:check
      - name: Lint and typecheck
        run: npm run ci:lint
      - name: Theme token hex guard
        run: npm run theme:hex:check
      # `npm run qa` invokes `npm run impeccable`. That check needs Node 24+, so
      # on Node 20 it used to exit 0 with a warning - the gate was green in CI
      # and red on any current developer machine. The runner is now Node 24 and
      # IMPECCABLE_ENFORCE makes the findings fail, so CI evaluates what a
      # developer evaluates.
      - name: Spec and workflow QA
        env:
          IMPECCABLE_ENFORCE: '1'
        run: npm run qa
      - name: Graph validation
        run: npm run graphify:validate
      - name: Pricing service coverage check
        run: npm run pricing:coverage:check
      - name: Full progress verification check
        run: npm run progress:verify
      - name: DevOps configuration check
        run: npm run devops:check
      - name: Cloud readiness check
        run: npm run cloud:check
      - name: Release readiness check
        run: npm run release:check
      - name: Provider credential readiness check
        run: npm run provider:credentials:check
      - name: Database migration validation
        run: npm run db:validate
      - name: OpenAPI contract check
        run: npm run openapi:check
      - name: Prometheus alert rules check
        run: npm run alerts:check
      - name: Helm lint and render
        run: npm run helm:lint
      - name: Unit tests with coverage
        run: npm run ci:unit
      - name: Production-readiness focused regressions
        run: npm run test:production-readiness
      - name: Integration tests
        run: npm run ci:integration
      - name: Build
        run: npm run ci:build
      - name: Bundle budget
        run: npm run bundle:budget
      - name: E2E tests
        run: npm run ci:e2e
      - name: Dependency security scan
        run: npm run security:audit

  # Audit H-14: secret and vulnerability scanning that blocks the merge. Both
  # scanners run from pinned images, the same versions developers use locally
  # (`npm run security:scan`). Reviewed exceptions live in .gitleaksignore and
  # .trivyignore.yaml, each with a reason.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, so a secret committed and then deleted is still caught.
          fetch-depth: 0
      - name: Secret scan (git history)
        # safe.directory: the checkout belongs to the runner user, not the
        # container's root, and git refuses to read it otherwise.
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git . --redact --no-banner --exit-code 1
      - name: Dependency and secret scan (filesystem)
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
          fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --quiet .
      - name: IaC misconfiguration scan (Dockerfiles, Helm)
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          aquasec/trivy:0.71.0@sha256:016eae51fdcf989332a5404af7e8f625cd5d95d7c0907a221d080a996f556500
          config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 --quiet .

  # UI-7: screenshot regression and Lighthouse budgets. Runs inside the same
  # Playwright image the baselines were generated in, so fonts and rasterisation
  # match pixel for pixel. To refresh baselines after an intended visual change:
  #   docker run --rm -v "$PWD":/work -w /work mcr.microsoft.com/playwright:v1.63.0-noble \
  #     bash -lc 'npm ci && npm run build --workspace @polycost/web && cd apps/web && npm run test:visual:update'
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Playwright's recommended setting: share the host IPC namespace so
      # Chromium is not limited to Docker's 64 MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: npm ci
      - name: Build web
        run: npm run build --workspace @polycost/web
      - name: Visual regression
        run: npm run test:visual --workspace @polycost/web
      - name: Lighthouse budgets
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")"
          npm run lighthouse:ci
      - name: Upload visual diffs and Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-and-lighthouse
          path: |
            test-results/web-playwright
            .lighthouseci/reports
