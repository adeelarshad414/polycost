version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) is not supported by typescript-eslint
      # (<6.1) or ts-jest (<7) yet. Remove when both declare support.
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5

  # Base images in the Dockerfiles (node, nginx, alpine).
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /docker/notary-receiver
      - /database
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    ignore:
      # Images stay on the Node LTS line that CI runs (audit M-16). Move CI and
      # every image together when the next LTS is chosen, not image by image.
      - dependency-name: node
        versions: ['>=25']
