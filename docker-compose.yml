services:
  vault:
    image: hashicorp/vault:1.18
    environment:
      SKIP_SETCAP: 'true'
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_DEV_ROOT_TOKEN_ID: dev-only-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - '${VAULT_HOST_PORT:-8200}:8200'
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 5s
      timeout: 3s
      retries: 20

  vault-seed:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-only-root-token
    entrypoint: ['/bin/sh', '/vault-seed/seed.sh']
    volumes:
      - ./vault-seed:/vault-seed:ro
      - polycost-dev-secrets:/run/polycost-secrets
      - polycost-vault-auth:/run/polycost-vault-auth

  postgres:
    image: postgres:16-alpine
    depends_on:
      vault-seed:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: polycost_owner
      POSTGRES_DB: polycost_dev
    entrypoint: ['/bin/sh', '/polycost-postgres/start.sh']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - polycost-dev-secrets:/run/polycost-secrets:ro
      - ./docker/postgres:/polycost-postgres:ro
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./database/migrations:/polycost-migrations:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polycost_app -d polycost_dev']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Persistence is ON. BullMQ keeps all job state in Redis - queued, delayed
    # and failed jobs alike - so with saving disabled every restart silently
    # discarded scheduled work and the failure history needed to diagnose it.
    # appendfsync everysec bounds the loss window to ~1s without the fsync cost
    # of `always`.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--save', '900 1']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Opt-in dashboards. Datasource and dashboards are provisioned from files, so
  # the container is disposable - nothing worth keeping lives in its database.
  grafana:
    image: grafana/grafana:11.4.0
    profiles: ['observability']
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Local-only convenience: this stack is not exposed beyond the host.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_PORT:-3300}:3000'

  # Opt-in metrics + alerting, same profile as the collector:
  # `docker compose --profile observability up`. Loads ops/prometheus/alerts.yaml
  # so the rules can be checked against a real scrape rather than only linted.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ['observability']
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - ./ops/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./ops/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'

  # Opt-in trace collector: `docker compose --profile observability up`.
  # Kept behind a profile so the default stack stays small - tracing is a no-op
  # unless OTEL_EXPORTER_OTLP_ENDPOINT is set on the api service.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: ['observability']
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./ops/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318'
    healthcheck:
      test: ['CMD', '/otelcol-contrib', 'components']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-seed:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      # Unset by default: tracing stays off unless an endpoint is provided.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-polycost-api}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      # Self-hosted GlitchTip DSN. Unset disables error reporting.
      ERROR_TRACKING_DSN: ${ERROR_TRACKING_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: polycost_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/polycost-vault-auth/token
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}
      PRICING_ETL_SCHEDULE_CRON: ${PRICING_ETL_SCHEDULE_CRON:-0 2 * * *}
      CURRENCY_SYNC_SCHEDULE_CRON: ${CURRENCY_SYNC_SCHEDULE_CRON:-0 * * * *}
      ALERT_EVALUATOR_SCHEDULE_CRON: ${ALERT_EVALUATOR_SCHEDULE_CRON:-*/15 * * * *}
      SHARE_LINK_CLEANUP_SCHEDULE_CRON: ${SHARE_LINK_CLEANUP_SCHEDULE_CRON:-0 3 * * *}
      PRICING_SYNC_ALERT_WEBHOOK_URL: ${PRICING_SYNC_ALERT_WEBHOOK_URL:-}
      EXCHANGE_RATE_API_URL: ${EXCHANGE_RATE_API_URL:-https://api.frankfurter.app/latest}
      EXCHANGE_RATE_TARGET_CURRENCIES: ${EXCHANGE_RATE_TARGET_CURRENCIES:-EUR,GBP,CAD,AUD,PKR,INR,JPY}
      PRICING_ETL_DEFAULT_REGION_AWS: ${PRICING_ETL_DEFAULT_REGION_AWS:-us-east-1}
      PRICING_ETL_DEFAULT_REGION_AZURE: ${PRICING_ETL_DEFAULT_REGION_AZURE:-eastus}
      PRICING_ETL_DEFAULT_REGION_GCP: ${PRICING_ETL_DEFAULT_REGION_GCP:-us-central1}
      USE_MOCK_PROVIDERS: ${USE_MOCK_PROVIDERS:-true}
      PRICING_ETL_RUN_ON_BOOT: ${PRICING_ETL_RUN_ON_BOOT:-true}
      RATE_LIMIT_NL_PARSE_PER_MINUTE: ${RATE_LIMIT_NL_PARSE_PER_MINUTE:-10}
      RATE_LIMIT_LIVE_REFRESH_PER_MINUTE: ${RATE_LIMIT_LIVE_REFRESH_PER_MINUTE:-5}
      RATE_LIMIT_COMPARISON_PER_MINUTE: ${RATE_LIMIT_COMPARISON_PER_MINUTE:-30}
      RATE_LIMIT_EXPORT_PER_MINUTE: ${RATE_LIMIT_EXPORT_PER_MINUTE:-10}
      RATE_LIMIT_SHARE_LINK_PER_MINUTE: ${RATE_LIMIT_SHARE_LINK_PER_MINUTE:-20}
      RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-60}
      RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE: ${RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE:-30}
      FEATURE_LIVE_PRICING_REFRESH_ENABLED: ${FEATURE_LIVE_PRICING_REFRESH_ENABLED:-true}
      FEATURE_RESERVED_PRICING: ${FEATURE_RESERVED_PRICING:-true}
    ports:
      - '${API_HOST_PORT:-3001}:${API_PORT:-3001}'
    volumes:
      - polycost-vault-auth:/run/polycost-vault-auth:ro
    healthcheck:
      test: ['CMD-SHELL', 'node dist/healthcheck.js "$${PORT}"']
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:80'

volumes:
  postgres-data:
  redis-data:
  polycost-dev-secrets:
  polycost-vault-auth:
